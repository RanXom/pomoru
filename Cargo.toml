[workspace]
members = ["crates/pomoru-core", "desktop/src-tauri"]
resolver = "2"

[package]
name = "pomoru"
version = "1.1.0"
edition = "2026"

[dependencies]
pomoru-core = { path = "crates/pomoru-core" }
crossterm = "0.29.0"
directories = "6.0.0"
ratatui = "0.30.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.49.0", features = ["full"] }
