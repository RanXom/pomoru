[package]
name = "pomoru-desktop"
version = "2.0.0"
description = "Pomoru Desktop — A minimal Pomodoro timer"
authors = ["RanXom"]
edition = "2024"

[lib]
name = "desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
pomoru-core = { path = "../../crates/pomoru-core" }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6.0.0"
